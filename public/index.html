<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tom Riddle's Diary</title>
  <link href="https://fonts.loli.net/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@400;700&family=Caveat:wght@400;600&family=Long+Cang&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.loli.net/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@400;700&family=Caveat:wght@400;600&family=Long+Cang&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <!-- Cover Page -->
    <div id="cover-page" class="page active">
      <div class="cover-bg"></div>
      <div class="cover-content">
        <div class="slytherin-crest">
          <div class="crest-shield">
            <div class="crest-snake">S</div>
          </div>
          <div class="crest-banner">SLYTHERIN</div>
        </div>
        <h1 class="cover-title">Tom Riddle's</h1>
        <h2 class="cover-subtitle">Diary</h2>
        <div class="cover-decoration">~ ~ ~</div>
        <p class="cover-quote" data-i18n="cover_quote">"I can make things happen... in the world of the diary, of course."</p>
        <button id="open-diary-btn" class="cover-button">
          <span class="btn-text" data-i18n="open_diary">打开日记</span>
          <span class="btn-icon">&#9997;</span>
        </button>
        <div id="user-status" class="user-status hidden">
          <span class="user-greeting-wrap">Welcome, <span id="user-greeting"></span></span>
          <button id="logout-btn" class="link-btn" data-i18n="logout">退出登录</button>
        </div>
      </div>
      <div class="cover-vines top-left"></div>
      <div class="cover-vines top-right"></div>
      <div class="cover-vines bottom-left"></div>
      <div class="cover-vines bottom-right"></div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <button class="modal-close" id="modal-close">&times;</button>
        <div class="modal-crest">
          <div class="mini-snake">S</div>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login" data-i18n="tab_login">登录</button>
          <button class="auth-tab" data-tab="register" data-i18n="tab_register">注册</button>
        </div>

        <form id="login-form" class="auth-form active">
          <div class="form-group">
            <label data-i18n="label_username">用户名</label>
            <input type="text" id="login-username" required autocomplete="username" data-i18n-placeholder="placeholder_username">
          </div>
          <div class="form-group">
            <label data-i18n="label_password">密码</label>
            <input type="password" id="login-password" required autocomplete="current-password" data-i18n-placeholder="placeholder_password">
          </div>
          <div id="login-error" class="form-error hidden"></div>
          <button type="submit" class="submit-btn" data-i18n="btn_login">登录</button>
        </form>

        <form id="register-form" class="auth-form">
          <div class="form-group">
            <label data-i18n="label_username">用户名</label>
            <input type="text" id="reg-username" required autocomplete="username" data-i18n-placeholder="placeholder_choose_username">
          </div>
          <div class="form-group">
            <label data-i18n="label_password">密码</label>
            <input type="password" id="reg-password" required autocomplete="new-password" data-i18n-placeholder="placeholder_choose_password">
          </div>
          <div id="register-error" class="form-error hidden"></div>
          <button type="submit" class="submit-btn" data-i18n="btn_register">注册</button>
        </form>

        <div class="language-select">
          <label class="lang-label" data-i18n="lang_label">语言 / Language</label>
          <div class="lang-options">
            <button class="lang-btn active" data-lang="zh">
              <span class="lang-flag">中文</span>
            </button>
            <button class="lang-btn" data-lang="en">
              <span class="lang-flag">English</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Diary History Panel (mobile) -->
    <div id="history-panel" class="history-panel hidden">
      <div class="history-backdrop"></div>
      <div class="history-drawer">
        <div class="history-header">
          <h3 data-i18n="my_diary">我的日记</h3>
          <button id="history-close" class="history-close-btn">&times;</button>
        </div>
        <div id="history-list" class="history-list">
          <p class="empty-msg" data-i18n="no_entries">暂无日记</p>
        </div>
      </div>
    </div>

    <!-- Diary Page -->
    <div id="diary-page" class="page hidden">
      <div class="diary-sidebar">
        <div class="sidebar-header">
          <button id="back-cover" class="sidebar-btn back-btn" title="Back">&#9664;</button>
          <h3 class="sidebar-title" data-i18n="my_diary">我的日记</h3>
          <button id="new-diary-btn" class="sidebar-btn new-btn" title="New">+</button>
        </div>
        <div id="diary-list" class="diary-list">
          <p class="empty-msg" data-i18n="no_entries">暂无日记</p>
        </div>
      </div>

      <div class="diary-main">
        <div class="diary-toolbar">
          <div class="mode-switch">
            <span class="mode-label">AI</span>
            <label class="switch">
              <input type="checkbox" id="ai-toggle">
              <span class="slider"></span>
            </label>
            <span class="mode-status" id="ai-status">OFF</span>
            <span class="ai-link-status" id="ai-link-status" title="AI connection">&#9679;</span>
          </div>
          <div class="toolbar-actions">
            <button id="mobile-new-btn" class="toolbar-btn mobile-only" title="New">+</button>
            <button id="mobile-history-btn" class="toolbar-btn mobile-only" title="History">&#9776;</button>
            <span id="diary-date" class="diary-date"></span>
            <button id="save-btn" class="toolbar-btn" title="Save">&#128190;</button>
            <button id="delete-btn" class="toolbar-btn delete-btn" title="Delete">&#128465;</button>
          </div>
        </div>

        <div class="diary-paper">
          <div class="paper-texture"></div>
          <div class="diary-scroll">
            <div id="diary-blocks" class="diary-blocks"></div>
            <div id="diary-content" class="diary-content" contenteditable="true" spellcheck="false" data-i18n-placeholder="placeholder_write"></div>
            <div id="ai-typing" class="ai-typing hidden">
              <div class="loading-dots"><span></span><span></span><span></span></div>
            </div>
          </div>
          <div class="paper-lines"></div>
        </div>

        <div class="diary-footer">
          <span class="footer-hint" data-i18n="footer_hint">在羊皮纸上书写，按 Enter 提交给日记本</span>
          <button id="submit-btn" class="submit-diary-btn" title="Submit">
            <span class="submit-icon">&#9998;</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
