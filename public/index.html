<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tom Riddle's Diary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@400;700&family=UnifrakturMaguntia&family=MedievalSharp&family=Noto+Serif+SC:wght@400;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <!-- Cover Page -->
    <div id="cover-page" class="page active">
      <div class="cover-bg"></div>
      <div class="cover-content">
        <div class="slytherin-crest">
          <div class="crest-shield">
            <div class="crest-snake">S</div>
          </div>
          <div class="crest-banner">SLYTHERIN</div>
        </div>
        <h1 class="cover-title">Tom Riddle's</h1>
        <h2 class="cover-subtitle">Diary</h2>
        <div class="cover-decoration">~ ~ ~</div>
        <p class="cover-quote">"I can make things happen... in the world of the diary, of course."</p>
        <button id="open-diary-btn" class="cover-button">
          <span class="btn-text">Open the Diary</span>
          <span class="btn-icon">&#9997;</span>
        </button>
        <div id="user-status" class="user-status hidden">
          <span id="user-greeting"></span>
          <button id="logout-btn" class="link-btn">Logout</button>
        </div>
      </div>
      <div class="cover-vines top-left"></div>
      <div class="cover-vines top-right"></div>
      <div class="cover-vines bottom-left"></div>
      <div class="cover-vines bottom-right"></div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <button class="modal-close" id="modal-close">&times;</button>
        <div class="modal-crest">
          <div class="mini-snake">S</div>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Login</button>
          <button class="auth-tab" data-tab="register">Register</button>
        </div>

        <form id="login-form" class="auth-form active">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="login-username" required autocomplete="username" placeholder="Enter your username">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" required autocomplete="current-password" placeholder="Enter your password">
          </div>
          <div id="login-error" class="form-error hidden"></div>
          <button type="submit" class="submit-btn">Login</button>
        </form>

        <form id="register-form" class="auth-form">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="reg-username" required autocomplete="username" placeholder="Choose a username">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="reg-password" required autocomplete="new-password" placeholder="Choose a password">
          </div>
          <div id="register-error" class="form-error hidden"></div>
          <button type="submit" class="submit-btn">Register</button>
        </form>

        <div class="language-select">
          <label class="lang-label">AI Language / AI语言</label>
          <div class="lang-options">
            <button class="lang-btn active" data-lang="zh">
              <span class="lang-flag">中文</span>
            </button>
            <button class="lang-btn" data-lang="en">
              <span class="lang-flag">English</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Diary Page -->
    <div id="diary-page" class="page hidden">
      <div class="diary-sidebar">
        <div class="sidebar-header">
          <button id="back-cover" class="sidebar-btn back-btn" title="Back to Cover">&#9664;</button>
          <h3 class="sidebar-title">My Diary</h3>
          <button id="new-diary-btn" class="sidebar-btn new-btn" title="New Entry">+</button>
        </div>
        <div id="diary-list" class="diary-list">
          <p class="empty-msg">No entries yet</p>
        </div>
      </div>

      <div class="diary-main">
        <div class="diary-toolbar">
          <div class="mode-switch">
            <span class="mode-label">AI</span>
            <label class="switch">
              <input type="checkbox" id="ai-toggle">
              <span class="slider"></span>
            </label>
            <span class="mode-status" id="ai-status">OFF</span>
          </div>
          <div class="toolbar-actions">
            <span id="diary-date" class="diary-date"></span>
            <button id="save-btn" class="toolbar-btn" title="Save">&#128190;</button>
            <button id="delete-btn" class="toolbar-btn delete-btn" title="Delete">&#128465;</button>
          </div>
        </div>

        <div class="diary-paper">
          <div class="paper-texture"></div>
          <div class="diary-content-wrapper">
            <div id="diary-content" class="diary-content" contenteditable="true" spellcheck="false" data-placeholder="Begin writing your diary..."></div>
            <div id="ai-reply-area" class="ai-reply-area hidden">
              <div class="ai-reply-divider">
                <span class="divider-ornament">&#10045;</span>
              </div>
              <div id="ai-reply" class="ai-reply"></div>
            </div>
          </div>
          <div class="paper-lines"></div>
        </div>

        <div class="diary-footer">
          <button id="submit-btn" class="submit-diary-btn" title="Submit">
            <span class="submit-text">Submit to the Diary</span>
            <span class="submit-icon">&#9998;</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
